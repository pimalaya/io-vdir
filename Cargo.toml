[package]
name = "io-vdir"
description = "Vdir client library"
version = "0.0.3"
authors = ["soywod <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "filesystem"]
keywords = ["io-free", "coroutine", "vdir", "vcard", "ical"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-vdir/latest/io_vdir"
repository = "https://github.com/pimalaya/io-vdir"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "parser", "serde"]
client = ["dep:getrandom"]
parser = ["dep:calcard"]
serde = ["dep:serde"]

[[example]]
name = "std_store_item"
required-features = ["client"]

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.20"

[dependencies]
calcard = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
thiserror = { version = "2", default-features = false }
